# Reverse proxy: TLS terminates here, the app never faces the internet.
#
# Replace every DOMAIN_PLACEHOLDER with the real domain before the first
# start (deploy/setup.sh does this for you).

# ---------------------------------------------------------------------------
# Port 80 — ACME challenges, and a redirect for everything else.
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN_PLACEHOLDER www.DOMAIN_PLACEHOLDER;

    # Must stay on plain HTTP: Let's Encrypt fetches this over port 80 and
    # will not follow a redirect to a certificate that does not exist yet.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# Port 443 — the site.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name DOMAIN_PLACEHOLDER www.DOMAIN_PLACEHOLDER;

    ssl_certificate     /etc/letsencrypt/live/DOMAIN_PLACEHOLDER/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN_PLACEHOLDER/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Uploads are capped at 25MB in the upload route; keep nginx from
    # rejecting a valid one first with its 1MB default.
    client_max_body_size 30M;

    # Tells browsers to use HTTPS on their own for a year. Only safe once
    # the certificate is working — a broken cert plus HSTS locks visitors
    # out, so uncomment it after you have confirmed the site loads.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml+rss;

    # Immutable build assets — filenames contain a content hash, so a long
    # cache is safe and saves the app from serving them at all.
    location /_next/static/ {
        proxy_pass http://app:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Uploaded media. The route handler already sets immutable caching;
    # this just avoids re-negotiating it on every request.
    location /api/media/ {
        proxy_pass http://app:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;

        # Without these the app sees nginx's own address and builds
        # redirects pointing at http://app:3000.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
